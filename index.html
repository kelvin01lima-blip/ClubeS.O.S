        volume_pecas: "-",
        gargalos: "Renovação de Contrato Anual Exclusiva",
        solucoes: "Renovação de Plano com Desconto em Serviços",
        whatsapp: wpp
      };

      sendToGoogle(payload, "Solicitação de Renovação Registrada!");
    }

    function sendToGoogle(payload, titleText) {
      fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).then(() => {
        document.getElementById('successTitle').innerText = titleText;
        goToStep('success');
      }).catch(err => {
        alert("Erro ao enviar dados. Verifique a conexão.");
      });
    }
  </script>
